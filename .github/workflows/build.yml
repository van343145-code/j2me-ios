name: Build jarNO1 iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-26-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Verify jarNO1 & Runtime Assets
        run: |
          test -f Runtime/j2mejs/index.html
          test -f Runtime/j2mejs/java/classes.jar
          test -f Runtime/j2mejs/certs/_main.ks
          test -f Runtime/j2mejs/js/nsv-runtime.js
          test -f Runtime/j2mejs/js/nsv-network.js
          test -f Runtime/j2mejs/VanTranidol_NokiaE6.jar
          test -f J2MEEmulator/Resources/nj.jpg
          test -f J2MEEmulator/Resources/avatar.jpg
          test -f J2MEEmulator/Resources/background-loop.wav
          test -f J2MEEmulator/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          test -f Licenses/Runtime-Attribution.txt

      - name: Build Application with Xcode
        run: |
          set -o pipefail
          xcodebuild -project J2MEEmulator.xcodeproj \
            -target J2MEEmulator \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$PWD/build_out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            clean build 2>&1 | tee build_raw.log || {
              echo "=== BUILD FAILED - RECENT LOGS ==="
              tail -n 120 build_raw.log
              exit 1
            }

      - name: Package App into IPA
        run: |
          rm -rf Payload jarNO1.ipa jarNO1-unsigned.ipa
          mkdir -p Payload
          APP_PATH=$(find "$PWD/build_out" -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Built .app bundle not found!"
            exit 1
          fi
          echo "Found App at: $APP_PATH"
          cp -R "$APP_PATH" Payload/

          BUNDLE_PATH=$(find Payload -maxdepth 1 -name "*.app" -type d | head -n 1)
          echo "Verifying embedded jarNO1 + Runtime inside: $BUNDLE_PATH"
          test -f "$BUNDLE_PATH/jarNO1"
          test -f "$BUNDLE_PATH/Runtime/j2mejs/index.html"
          test -f "$BUNDLE_PATH/Runtime/j2mejs/java/classes.jar"
          test -f "$BUNDLE_PATH/Runtime/j2mejs/certs/_main.ks"
          test -f "$BUNDLE_PATH/Runtime/j2mejs/VanTranidol_NokiaE6.jar"
          test -f "$BUNDLE_PATH/nj.jpg"
          test -f "$BUNDLE_PATH/avatar.jpg"
          test -f "$BUNDLE_PATH/background-loop.wav"
          test ! -d "$BUNDLE_PATH/LaunchScreen.storyboardc"

          # 1. Unsigned clean IPA (no _CodeSignature, compatible with web signers / ESign / KSign)
          rm -rf "$BUNDLE_PATH/_CodeSignature" "$BUNDLE_PATH/embedded.mobileprovision"
          chmod 755 "$BUNDLE_PATH/jarNO1"
          codesign --remove-signature "$BUNDLE_PATH/jarNO1" || true
          zip -r jarNO1-unsigned.ipa Payload/

          # 2. Standard ad-hoc IPA (100% identical packaging structure to proven installable build)
          codesign --force --deep --sign - "$BUNDLE_PATH"
          codesign --verify --deep --strict "$BUNDLE_PATH"
          echo "=== Content of App Bundle ==="
          ls -la "$BUNDLE_PATH/"
          zip -r jarNO1.ipa Payload/
          ls -lh jarNO1.ipa jarNO1-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarNO1-IPA
          path: |
            jarNO1.ipa
            jarNO1-unsigned.ipa
          retention-days: 14

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.2-jarNO1
          name: "jarNO1 iOS v1.0.2 (Fix lỗi xác minh tính toàn vẹn iOS 26 + 1:1 J2ME NST)"
          body: |
            ## jarNO1 iOS v1.0.2 — Fix lỗi cài đặt "không thể xác minh tính toàn vẹn"
            - **Khôi phục 100% cấu trúc bundle iOS 26 đã cài thành công**: Thêm lại `UIApplicationSceneManifest` + `SwiftUI` `App` entry point + `UILaunchScreen` gốc, gỡ bỏ hoàn toàn `LaunchScreen.storyboardc` (loại bỏ `Info.plist` lồng nhau gây lỗi ký), bỏ cờ nén `-9` (`zip -r` chuẩn).
            - **Giữ nguyên 100% giao diện & lõi 1:1 `J2ME NST`**: Light Mode `#F3F1EA` / `#FAFAFA`, Accent `#C9541F`, `HomeTabBar`, `nj.jpg`, `avatar.jpg`, `background-loop.wav`, bàn phím 15 phím `NstKeyboard`, đa cửa sổ, Proxy SOCKS5/HTTP và POSIX loopback server.
            - **Cung cấp 2 bản IPA**:
              - `jarNO1.ipa`: bản chuẩn ad-hoc (giống hệt cấu trúc bản cũ đã cài thành công).
              - `jarNO1-unsigned.ipa`: bản sạch không `_CodeSignature` (dự phòng nếu công cụ ký ưu tiên IPA chưa ký).
          files: |
            jarNO1.ipa
            jarNO1-unsigned.ipa

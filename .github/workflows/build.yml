name: Build J2ME Decade iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-26-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build j2me_rust_engine for iOS
        run: |
          echo "=== Building j2me_rust_engine for iOS aarch64 ==="
          cargo build --manifest-path j2me_rust_engine/Cargo.toml --target aarch64-apple-ios --release
          ls -lh j2me_rust_engine/target/aarch64-apple-ios/release/libj2me_rust_engine.a

      - name: Compile and Package j2me_api.jar
        run: |
          echo "=== Compiling j2me_api.jar ==="
          cd j2me_api
          rm -rf classes sources.txt
          mkdir -p classes
          find src -name "*.java" > sources.txt
          javac --release 8 -cp "../J2MEEmulator/Resources/jars/minijvm_rt.jar" -d classes @sources.txt
          jar cf "../J2MEEmulator/Resources/jars/j2me_api.jar" -C classes .
          rm -rf classes sources.txt
          cd ..
          ls -lh J2MEEmulator/Resources/jars/j2me_api.jar

      - name: Build Application with Xcode
        run: |
          set -o pipefail
          xcodebuild -project J2MEEmulator.xcodeproj \
            -target J2MEEmulator \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$PWD/build_out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            clean build 2>&1 | tee build_raw.log || {
              echo "=== BUILD FAILED - RECENT LOGS ==="
              tail -n 120 build_raw.log
              exit 1
            }

      - name: Package App into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find "$PWD/build_out" -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          fi
          echo "Found App at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          cp -v J2MEEmulator/Resources/silent.wav Payload/*.app/ || true
          cp -v J2MEEmulator/SupportingFiles/J2MEEmulator.entitlements Payload/*.app/ || true
          cp -v j2me_rust_engine/include/j2me_engine.h Payload/*.app/ || true
          codesign --force --deep --sign - --entitlements J2MEEmulator/SupportingFiles/J2MEEmulator.entitlements Payload/*.app || true
          echo "=== Content of App Bundle ==="
          ls -la Payload/*.app/
          zip -r J2ME-Decade.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-Decade-IPA
          path: J2ME-Decade.ipa
          retention-days: 14

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v2.24-rust
          name: "Vạn Trần J2ME Native iOS v2.24 (Tích hợp Lõi Rust & Chuẩn Chơi Game Tuổi Thơ)"
          body: |
            ## Vạn Trần J2ME iOS v2.24 — Tích hợp Mã Nguồn Lõi Rust Engine & Full Flutter Source
            - **Tác giả**: **Vạn Trần idol J2me NSV IOS**
            - 🦀 **Lõi Giả Lập Rust Engine (`j2me_rust_engine`)**:
              - Được xây dựng hoàn toàn bằng ngôn ngữ Rust kế thừa từ kiến trúc của "Chơi Game Tuổi Thơ".
              - Tầng mạng BSD native `TCP_NODELAY` + Keepalive 10s non-blocking.
              - Triệt tiêu render nền `set_sleeping(true)` + 450ms pacing giúp máy mát rượi, không sụt pin khi ẩn ứng dụng/khoá màn hình.
              - Đính kèm file thư viện tĩnh iOS `libj2me_rust_engine.a` cho các nhà phát triển.
            - 📱 **Giao Diện Đa Nền Tảng (`j2me_flutter_app`)**:
              - Đầy đủ mã nguồn Flutter D-pad, bàn phím số Nokia, haptic feedback và bộ chọn file JAR.
            - ⚡ **Bản IPA `J2ME-Decade.ipa` v2.24**:
              - Đã tích hợp đầy đủ bí thuật ngủ đông đồ hoạ, socket ưu tiên `SO_TC_VO`, auto tàn sát zNinjaPro.
              - Cài đặt trực tiếp qua TrollStore, Sideloadly, Scarlet hoặc 3uTools.
          files: |
            J2ME-Decade.ipa
            j2me_rust_engine/target/aarch64-apple-ios/release/libj2me_rust_engine.a

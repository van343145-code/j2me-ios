name: Build J2ME NST iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-26-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Verify NST & Runtime Assets
        run: |
          test -f Runtime/j2mejs/index.html
          test -f Runtime/j2mejs/java/classes.jar
          test -f Runtime/j2mejs/certs/_main.ks
          test -f Runtime/j2mejs/js/nsv-runtime.js
          test -f Runtime/j2mejs/js/nsv-network.js
          test -f Runtime/j2mejs/VanTranidol_NokiaE6.jar
          test -f J2MEEmulator/Resources/nj.jpg
          test -f J2MEEmulator/Resources/avatar.jpg
          test -f J2MEEmulator/Resources/background-loop.wav
          test -f J2MEEmulator/Resources/LaunchScreen.storyboard
          test -f J2MEEmulator/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          test -f Licenses/Runtime-Attribution.txt

      - name: Build Application with Xcode
        run: |
          set -o pipefail
          xcodebuild -project J2MEEmulator.xcodeproj \
            -target J2MEEmulator \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$PWD/build_out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            clean build 2>&1 | tee build_raw.log || {
              echo "=== BUILD FAILED - RECENT LOGS ==="
              tail -n 120 build_raw.log
              exit 1
            }

      - name: Package App into IPA
        run: |
          rm -rf Payload J2ME-NST.ipa
          mkdir -p Payload
          APP_PATH=$(find "$PWD/build_out" -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Built .app bundle not found!"
            exit 1
          fi
          echo "Found App at: $APP_PATH"
          cp -R "$APP_PATH" Payload/

          BUNDLE_PATH=$(find Payload -maxdepth 1 -name "*.app" -type d | head -n 1)
          echo "Verifying embedded NST + Runtime inside: $BUNDLE_PATH"
          test -f "$BUNDLE_PATH/Runtime/j2mejs/index.html"
          test -f "$BUNDLE_PATH/Runtime/j2mejs/java/classes.jar"
          test -f "$BUNDLE_PATH/Runtime/j2mejs/certs/_main.ks"
          test -f "$BUNDLE_PATH/Runtime/j2mejs/VanTranidol_NokiaE6.jar"
          test -f "$BUNDLE_PATH/nj.jpg"
          test -f "$BUNDLE_PATH/avatar.jpg"
          test -f "$BUNDLE_PATH/background-loop.wav"
          test -d "$BUNDLE_PATH/LaunchScreen.storyboardc"

          rm -rf "$BUNDLE_PATH/_CodeSignature"
          codesign --force --deep --sign - "$BUNDLE_PATH" || true
          echo "=== Content of App Bundle ==="
          ls -la "$BUNDLE_PATH/"
          zip -r J2ME-NST.ipa Payload/
          ls -lh J2ME-NST.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-NST-IPA
          path: J2ME-NST.ipa
          retention-days: 14

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0-nst
          name: "J2ME NST iOS v1.0.0 (Bản nhân bản 1:1 chuẩn giao diện & tài nguyên)"
          body: |
            ## J2ME NST iOS v1.0.0 — Nhân bản 1:1 Chuẩn Nguyên Bản
            - **Giao diện 1:1 `J2ME NST` (Light Mode `#F3F1EA` / `#FAFAFA`, Accent `#C9541F`)**: LaunchScreen, AppIcon kim cương xanh nguyên bản, `HomeTabBar` 2 tab (`Bản mod NST` / `Bản của bạn` + badge đếm), ảnh `nj.jpg`, `avatar.jpg` và tự trích xuất icon từ file `.jar`.
            - **Trình chạy đa cửa sổ (`MicroController`)**: Thanh tab trên cùng màu `#1C2534` (active `#69D21E`) mở song song tới 100 cửa sổ game + 4 nút `🎮`, `+`, `−`, `⋮` (`Treo tắt màn`, `Cỡ màn hình`, `Proxy`, `Cài đặt`, `Ẩn ứng dụng`, `Thoát`).
            - **Bàn phím ảo `NstKeyboard` 15 phím chuẩn tọa độ 1:1**: `↖ ↑ ↗ / ← OK → / ↙ ↓ ↘`, `F1`, `F2`, `HP` (`*`), `MP` (`#`), `Tab`, `Size`, đa chạm + giữ lặp + rung + tùy chỉnh độ mờ.
            - **Fix triệt để lỗi không mở được game**: Thay `NWConnection` bằng máy chủ nội bộ POSIX `127.0.0.1` truyền đủ 100% byte không gửi TCP RST, giữ `WKWebView` luôn hiển thị khi khởi động, hỗ trợ `SOCKS5` / `HTTP CONNECT` Proxy theo từng ô, giới hạn 30 FPS mặc định + `background-loop.wav` treo 24/24 mát máy.
          files: |
            J2ME-NST.ipa

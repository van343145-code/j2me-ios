name: Build J2ME Decade iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-26-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Compile and Package j2me_api.jar
        run: |
          echo "=== Compiling j2me_api.jar ==="
          cd j2me_api
          rm -rf classes sources.txt
          mkdir -p classes
          find src -name "*.java" > sources.txt
          javac --release 8 -cp "../J2MEEmulator/Resources/jars/minijvm_rt.jar" -d classes @sources.txt
          jar cf "../J2MEEmulator/Resources/jars/j2me_api.jar" -C classes .
          rm -rf classes sources.txt
          cd ..
          ls -lh J2MEEmulator/Resources/jars/j2me_api.jar

      - name: Build Application with Xcode
        run: |
          set -o pipefail
          xcodebuild -project J2MEEmulator.xcodeproj \
            -target J2MEEmulator \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$PWD/build_out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            clean build 2>&1 | tee build_raw.log || {
              echo "=== BUILD FAILED - RECENT LOGS ==="
              tail -n 120 build_raw.log
              exit 1
            }

      - name: Package App into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find "$PWD/build_out" -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          fi
          echo "Found App at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          cp -v J2MEEmulator/Resources/silent.wav Payload/*.app/ || true
          cp -v J2MEEmulator/SupportingFiles/J2MEEmulator.entitlements Payload/*.app/ || true
          codesign --force --deep --sign - --entitlements J2MEEmulator/SupportingFiles/J2MEEmulator.entitlements Payload/*.app || true
          echo "=== Content of App Bundle ==="
          ls -la Payload/*.app/
          zip -r J2ME-Decade.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-Decade-IPA
          path: J2ME-Decade.ipa
          retention-days: 14

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v2.21-native
          name: "Vạn Trần J2ME Native iOS v2.21"
          body: |
            ## Vạn Trần J2ME iOS v2.21 — Cơ Chế Giữ App & Cấp Quyền Chạy Nền Vô Thời Hạn Khi Tắt Màn Hình iPhone
            - **Tác giả**: **Vạn Trần idol J2me NSV IOS**
            - ⚡️ **Cơ Chế Cấp Quyền Chạy Nền Vô Thời Hạn (Unlimited Background Execution Privileges)**:
              - **Nhúng Entitlements Chạy Nền Vô Hạn (TrollStore & Sideloadly)**: Bổ sung bộ quyền tối cao `com.apple.multitasking.unlimited`, `com.apple.developer.multitasking.unlimited`, `com.apple.private.runningboard.assertions`, `com.apple.private.processassertion.unlimited` và `com.apple.private.kernel.override-cpumon`. Khi cài đặt bằng TrollStore hoặc chữ ký Ad-Hoc/Enterprise, iOS sẽ cấp đặc quyền thực thi nền vĩnh viễn không bao giờ ngắt tiến trình.
              - **Tự Động Kích Hoạt `BKSProcessAssertion` / `RBSAssertion`**: Tích hợp hàm native `decade_acquire_unlimited_background_assertion` trực tiếp gọi đến `AssertionServices` / `RunningBoardServices` với cờ `0xF` (chống suspend, chống giảm xung nhịp) ngay khi bật treo game hoặc tắt màn hình.
            - 🛡️ **Khắc Phục Triệt Để Lỗi iOS Tự Tắt App Sau Khi Khóa Màn Hình Lâu**:
              - **Triệt tiêu hiện tượng iOS RunningBoard kill app vì quá tải CPU**: Khi tắt màn hình, game loop trước đây trả về 0ms khiến Java quay cuồng ở tốc độ 10,000 FPS đốt cháy 100% của 1 nhân CPU (17%), khiến hệ thống giám sát của iOS tự trảm tiến trình (`EXC_RESOURCE CPU limit`). Bản vá v2.21 bổ sung cơ chế pacing nhịp game ở mức 28 FPS (~35ms) khi tắt màn hình, đưa CPU về mức **< 1%** mát rượi, không tốn pin và triệt tiêu 100% nguyên nhân bị iOS kill app!
              - **Khắc phục Audio Pipeline bị đóng băng trên Main Queue**: Chuyển toàn bộ quá trình phục hồi âm thanh (`AVAudioPlayer`), xử lý ngắt quãng (interruption) và đổi tuyến loa (route change) sang hàng đợi ngầm ưu tiên cao `audioQueue`, loại bỏ hoàn toàn lỗi kẹt trên `DispatchQueue.main` khi màn hình bị khóa.
              - **Tự động yêu cầu quyền Vị Trí Nền "Luôn Cho Phép" (Always Authorization)**: Khởi động tự động kiểm tra và yêu cầu quyền `Always` ngay từ khi mở app, bảo đảm khiên định vị BTS 0% pin luôn sẵn sàng giữ mạng cùng Audio.
            - 🌐 **Hệ Thống Giữ Mạng 24/24 Không Đứt**: Heartbeat 15s chống ngủ Wi-Fi & TCP Keepalive chống rớt cổng 4G/5G CGNAT.
            - **Cài đặt**: Tải file `J2ME-Decade.ipa` bên dưới rồi cài qua TrollStore, Sideloadly hoặc 3uTools.
          files: J2ME-Decade.ipa


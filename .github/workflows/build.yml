name: Build jarNO1 iOS IPA (Decade + NST Cool Core)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-26-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Compile and Package j2me_api.jar
        run: |
          echo "=== Compiling j2me_api.jar ==="
          cd j2me_api
          rm -rf classes sources.txt
          mkdir -p classes
          find src -name "*.java" > sources.txt
          javac --release 8 -cp "../J2MEEmulator/Resources/jars/minijvm_rt.jar" -d classes @sources.txt
          jar cf "../J2MEEmulator/Resources/jars/j2me_api.jar" -C classes .
          rm -rf classes sources.txt
          cd ..
          ls -lh J2MEEmulator/Resources/jars/j2me_api.jar

      - name: Build Application with Xcode
        run: |
          set -o pipefail
          xcodebuild -project J2MEEmulator.xcodeproj \
            -target J2MEEmulator \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$PWD/build_out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            clean build 2>&1 | tee build_raw.log || {
              echo "=== BUILD FAILED - RECENT LOGS ==="
              tail -n 120 build_raw.log
              exit 1
            }

      - name: Package Clean Unsigned jarNO1.ipa
        run: |
          rm -rf Payload jarNO1.ipa
          mkdir -p Payload
          APP_PATH=$(find "$PWD/build_out" -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Built .app bundle not found!"
            exit 1
          fi
          echo "Found App at: $APP_PATH"
          cp -R "$APP_PATH" Payload/

          BUNDLE_PATH=$(find Payload -maxdepth 1 -name "*.app" -type d | head -n 1)
          cp -v J2MEEmulator/Resources/silent.wav "$BUNDLE_PATH/" || true
          cp -v J2MEEmulator/Resources/background-loop.wav "$BUNDLE_PATH/" || true

          # Verify core Decade + NST files inside bundle
          test -f "$BUNDLE_PATH/jarNO1"
          test -f "$BUNDLE_PATH/j2me_api.jar"
          test -f "$BUNDLE_PATH/minijvm_rt.jar"
          test -f "$BUNDLE_PATH/silent.wav"
          test -f "$BUNDLE_PATH/background-loop.wav"

          # Clean unsigned IPA (no _CodeSignature, no LC_CODE_SIGNATURE — 100% matching installable J2ME-Decade.ipa)
          rm -rf "$BUNDLE_PATH/_CodeSignature" "$BUNDLE_PATH/embedded.mobileprovision"
          chmod 755 "$BUNDLE_PATH/jarNO1"
          codesign --remove-signature "$BUNDLE_PATH/jarNO1" || true
          echo "=== Content of jarNO1.app ==="
          ls -la "$BUNDLE_PATH/"
          zip -r jarNO1.ipa Payload/
          ls -lh jarNO1.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarNO1-IPA
          path: jarNO1.ipa
          retention-days: 14

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.10-jarNO1
          name: "jarNO1 iOS v1.0.10 (Sửa lỗi gốc CPU_FATAL 48s trong jthread_waitTime + khóa đệ quy Darwin)"
          body: |
            ## jarNO1 iOS v1.0.10 — Sửa Nguyên Nhân Gốc Gây Tắt App Ở 48s Khi Khóa Màn Hình
            - **Phát hiện chính xác từ crash log USB trên iPhone 16 Pro Max (`cpu_resource_fatal`)**:
              - Cả 5 crash log (`11:39` → `15:08`) và Flight Recorder (`47s`, `RAM 98MB`, `AVAudioPlayer playing`) đều chứng minh app **không bị tắt vì âm thanh hay thiếu RAM**, mà bị watchdog nền của iOS kết thúc ở giây 47–51 (`48s CPU / 49s`, `98%` trên 1 nhân) vì một luồng Java quay 0ms trong **`jthread_waitTime` → `cnd_timedwait` (`__psynch_cvwait`) + `timespec_get`**.
            - **Sửa triệt để tại `jthread_waitTime` (`jvm_util.c`) & `jni_reflect.c`**:
              1. **Bỏ qua `cnd_timedwait` khi không giữ monitor** (`saveThread != current_thread || saveCount <= 0` — trước đây `pthread_cond_timedwait` trên Darwin trả `EPERM` ngay trong <1µs khiến vòng lặp quay 2 triệu lần/giây ở 100% CPU) → chuyển sang ngủ an toàn bằng `threadSleep`.
              2. **Tháo khóa đệ quy chuẩn xác với `PTHREAD_MUTEX_RECURSIVE` của iOS** (`saveCount > 1`): mở `(saveCount - 1)` lần trước khi gọi `pthread_cond_(timed)wait` và khóa lại đúng số lần sau khi tỉnh để nhân Darwin luôn thấy lock count = 1.
              3. **Chặn timeout âm/tràn số & dùng `timespec_get` trực tiếp**: tránh mốc thời gian quá khứ gây `ETIMEDOUT` tức thì, kẹp micro-wait nền tối thiểu `25ms`, và kiểm tra kết quả trả về `thrd_error` + chống bão đánh thức trong nền (kèm ghi nhận `wait_spin_diag` nếu phát sinh).
              4. **Sửa `Unsafe.park` (`jni_reflect.c`) & Flight Recorder (`DecadeBackgroundKeeper.swift`)**: không truyền `waitms == 0` nhầm thành ngủ vô hạn khi hết hạn tuyệt đối, và chỉ ghi nhận phiên nền khi đang mở game.
          files: |
            jarNO1.ipa

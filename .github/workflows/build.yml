name: Build jarNO1 iOS IPA (Decade Engine)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-26-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Compile and Package j2me_api.jar
        run: |
          echo "=== Compiling j2me_api.jar ==="
          cd j2me_api
          rm -rf classes sources.txt
          mkdir -p classes
          find src -name "*.java" > sources.txt
          javac --release 8 -cp "../J2MEEmulator/Resources/jars/minijvm_rt.jar" -d classes @sources.txt
          jar cf "../J2MEEmulator/Resources/jars/j2me_api.jar" -C classes .
          rm -rf classes sources.txt
          cd ..
          ls -lh J2MEEmulator/Resources/jars/j2me_api.jar

      - name: Build Application with Xcode
        run: |
          set -o pipefail
          xcodebuild -project J2MEEmulator.xcodeproj \
            -target J2MEEmulator \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$PWD/build_out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            clean build 2>&1 | tee build_raw.log || {
              echo "=== BUILD FAILED - RECENT LOGS ==="
              tail -n 120 build_raw.log
              exit 1
            }

      - name: Package Clean Unsigned jarNO1.ipa
        run: |
          rm -rf Payload jarNO1.ipa
          mkdir -p Payload
          APP_PATH=$(find "$PWD/build_out" -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Built .app bundle not found!"
            exit 1
          fi
          echo "Found App at: $APP_PATH"
          cp -R "$APP_PATH" Payload/

          BUNDLE_PATH=$(find Payload -maxdepth 1 -name "*.app" -type d | head -n 1)
          cp -v J2MEEmulator/Resources/silent.wav "$BUNDLE_PATH/" || true
          cp -v J2MEEmulator/Resources/background-loop.wav "$BUNDLE_PATH/" || true

          # Verify core bundle files inside app
          test -f "$BUNDLE_PATH/jarNO1"
          test -f "$BUNDLE_PATH/j2me_api.jar"
          test -f "$BUNDLE_PATH/minijvm_rt.jar"
          test -f "$BUNDLE_PATH/silent.wav"
          test -f "$BUNDLE_PATH/background-loop.wav"

          # Clean unsigned IPA (no _CodeSignature, no LC_CODE_SIGNATURE — 100% matching installable J2ME-Decade.ipa)
          rm -rf "$BUNDLE_PATH/_CodeSignature" "$BUNDLE_PATH/embedded.mobileprovision"
          chmod 755 "$BUNDLE_PATH/jarNO1"
          codesign --remove-signature "$BUNDLE_PATH/jarNO1" || true
          echo "=== Content of jarNO1.app ==="
          ls -la "$BUNDLE_PATH/"
          zip -r jarNO1.ipa Payload/
          ls -lh jarNO1.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarNO1-IPA
          path: jarNO1.ipa
          retention-days: 14

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.17-jarNO1
          name: "jarNO1 iOS v1.0.17 (Fix Mất Mạng Khi Tắt Màn + Setup Bàn Phím Gọn + 8 Hướng)"
          body: |
            ## jarNO1 iOS v1.0.17 — Fix Mất Kết Nối Mạng Khi Treo Tắt Màn + Setup Bàn Phím + 8 Hướng
            - **Fix mất kết nối mạng khi treo tắt màn hình**:
              - **Chống iOS tắt/ngủ Audio & Tiến trình khi khóa màn (`DecadeBackgroundKeeper`)**: Đặt gain siêu âm `0.002` (~`-80 dBFS`, vẫn hoàn toàn im lặng với tai người) thay cho `0.0` để `mediaserverd` iOS 16–26 không đình chỉ tiến trình khi khóa màn; tăng handoff nền 20s + watchdog tự hồi phục mỗi 2s.
              - **Chống ngủ Wi-Fi & đứt NAT 4G/5G khi tắt màn (`DecadeNetworkKeeper` + `Info.plist`)**: Bật `UIRequiresPersistentWiFi` + `UIBackgroundModes: [audio, fetch]`; phát xung HTTP 204 0-byte nhẹ mỗi 18s chỉ khi chạy nền/ngủ màn OLED + làm mới socket tức thì khi chuyển Wi-Fi ↔ 5G.
              - **Giữ kết nối TCP tầng kernel (`decade_proxy_tunnel.c`, `net_sockets.c`, `jni_io.c`)**: Khôi phục QoS ưu tiên thoại thời gian thực (`NET_SERVICE_TYPE_VO` / `SO_TC_VO`), siết chu kỳ keepalive 10s/5s×24, và tự thử lại khi gặp `ENOBUFS` tạm thời lúc Wi-Fi/4G chuyển trạng thái.
            - **Gộp Setup Bàn Phím 1 màn hình & Fix bàn phím 8 hướng** (từ `v1.0.16`).
            - **Lõi x24 tab 512MB Heap & làm sạch thương hiệu jarNO1**.
          files: |
            jarNO1.ipa

name: Build jarNO1 iOS IPA (Decade + NST Cool Core)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-26-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Compile and Package j2me_api.jar
        run: |
          echo "=== Compiling j2me_api.jar ==="
          cd j2me_api
          rm -rf classes sources.txt
          mkdir -p classes
          find src -name "*.java" > sources.txt
          javac --release 8 -cp "../J2MEEmulator/Resources/jars/minijvm_rt.jar" -d classes @sources.txt
          jar cf "../J2MEEmulator/Resources/jars/j2me_api.jar" -C classes .
          rm -rf classes sources.txt
          cd ..
          ls -lh J2MEEmulator/Resources/jars/j2me_api.jar

      - name: Build Application with Xcode
        run: |
          set -o pipefail
          xcodebuild -project J2MEEmulator.xcodeproj \
            -target J2MEEmulator \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$PWD/build_out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            clean build 2>&1 | tee build_raw.log || {
              echo "=== BUILD FAILED - RECENT LOGS ==="
              tail -n 120 build_raw.log
              exit 1
            }

      - name: Package Clean Unsigned jarNO1.ipa
        run: |
          rm -rf Payload jarNO1.ipa
          mkdir -p Payload
          APP_PATH=$(find "$PWD/build_out" -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Built .app bundle not found!"
            exit 1
          fi
          echo "Found App at: $APP_PATH"
          cp -R "$APP_PATH" Payload/

          BUNDLE_PATH=$(find Payload -maxdepth 1 -name "*.app" -type d | head -n 1)
          cp -v J2MEEmulator/Resources/silent.wav "$BUNDLE_PATH/" || true
          cp -v J2MEEmulator/Resources/background-loop.wav "$BUNDLE_PATH/" || true

          # Verify core Decade + NST files inside bundle
          test -f "$BUNDLE_PATH/jarNO1"
          test -f "$BUNDLE_PATH/j2me_api.jar"
          test -f "$BUNDLE_PATH/minijvm_rt.jar"
          test -f "$BUNDLE_PATH/silent.wav"
          test -f "$BUNDLE_PATH/background-loop.wav"

          # Clean unsigned IPA (no _CodeSignature, no LC_CODE_SIGNATURE — 100% matching installable J2ME-Decade.ipa)
          rm -rf "$BUNDLE_PATH/_CodeSignature" "$BUNDLE_PATH/embedded.mobileprovision"
          chmod 755 "$BUNDLE_PATH/jarNO1"
          codesign --remove-signature "$BUNDLE_PATH/jarNO1" || true
          echo "=== Content of jarNO1.app ==="
          ls -la "$BUNDLE_PATH/"
          zip -r jarNO1.ipa Payload/
          ls -lh jarNO1.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarNO1-IPA
          path: jarNO1.ipa
          retention-days: 14

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.8-jarNO1
          name: "jarNO1 iOS v1.0.8 (Port sạch 1:1 nguyên lõi chạy nền J2ME NST 1.0.0 + sửa lag vào game)"
          body: |
            ## jarNO1 iOS v1.0.8 — Port Sạch 1:1 Nguyên Bộ Lõi Chạy Nền J2ME NST 1.0.0
            - **Sửa lỗi vào game bị chậm/khó vào ở v1.0.7**:
              - Hoàn nguyên `jthread_lock` trong `jvm_util.c` (bỏ delay `nanosleep 5ms` trên mỗi lock tranh chấp của miniJVM khi nạp class lúc khởi động game).
            - **Port sạch 100% 1:1 lõi `BackgroundAudio` + `AppDelegate` của `J2ME_NST_1.0.0.ipa`**:
              - **Gỡ bỏ hoàn toàn `AVAudioEngine` / `AVAudioSourceNode` / `silent.wav` / `protectedDataWillBecomeUnavailable`**: loại bỏ triệt để nguyên nhân gây `AVAudioEngineConfigurationChange` khi khóa màn hình làm gián đoạn phiên âm thanh ở nền.
              - **Dùng đúng 100% file `background-loop.wav` gốc của J2ME NST** (22050 Hz, 217 Hz, `peak=1603`, khớp SHA-256 từng byte) chạy bằng **`AVAudioPlayer` thuần** (`numberOfLoops = -1`, `volume = 0.0`, `prepareToPlay()`, `play()`) với đúng `AVAudioSession.setCategory(.playback, options: [.mixWithOthers])` + `setActive(true)`.
              - **Kết hợp đúng 2 điều kiện cốt lõi chưa từng có cùng lúc ở các bản trước**: (1) PiP tách hoàn toàn dạng lazy (không tạo `AVPictureInPictureController` / `AVSampleBufferDisplayLayer` lúc mở game) + (2) chạy thuần `AVAudioPlayer` trên `background-loop.wav` gốc của NST + handoff 4.0s & monitor 5.0s y hệt NST.
              - Giữ nguyên nút hiển thị rõ **`Treo 24/24: ĐANG BẬT ✓`**, tự nhớ vĩnh viễn khi vuốt đa nhiệm / khóa màn hình, tùy chọn 1 chạm **`Audio Độc quyền`** trong tab **`Treo 24/7`**, và dòng báo cáo chứng thực chạy nền thực tế khi mở khóa.
            - Giữ nguyên **không có chế độ Bong Bóng**, chỉ giữ **Cửa Sổ Nhỏ PiP kéo to nhỏ tự do** khi bật chủ động, đóng gói **unsigned sạch 100%** (`jarNO1.ipa`).
          files: |
            jarNO1.ipa

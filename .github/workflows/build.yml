name: Build jarNO1 iOS IPA (Decade + NST Cool Core)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-26-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Compile and Package j2me_api.jar
        run: |
          echo "=== Compiling j2me_api.jar ==="
          cd j2me_api
          rm -rf classes sources.txt
          mkdir -p classes
          find src -name "*.java" > sources.txt
          javac --release 8 -cp "../J2MEEmulator/Resources/jars/minijvm_rt.jar" -d classes @sources.txt
          jar cf "../J2MEEmulator/Resources/jars/j2me_api.jar" -C classes .
          rm -rf classes sources.txt
          cd ..
          ls -lh J2MEEmulator/Resources/jars/j2me_api.jar

      - name: Build Application with Xcode
        run: |
          set -o pipefail
          xcodebuild -project J2MEEmulator.xcodeproj \
            -target J2MEEmulator \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$PWD/build_out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            clean build 2>&1 | tee build_raw.log || {
              echo "=== BUILD FAILED - RECENT LOGS ==="
              tail -n 120 build_raw.log
              exit 1
            }

      - name: Package Clean Unsigned jarNO1.ipa
        run: |
          rm -rf Payload jarNO1.ipa
          mkdir -p Payload
          APP_PATH=$(find "$PWD/build_out" -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Built .app bundle not found!"
            exit 1
          fi
          echo "Found App at: $APP_PATH"
          cp -R "$APP_PATH" Payload/

          BUNDLE_PATH=$(find Payload -maxdepth 1 -name "*.app" -type d | head -n 1)
          cp -v J2MEEmulator/Resources/silent.wav "$BUNDLE_PATH/" || true
          cp -v J2MEEmulator/Resources/background-loop.wav "$BUNDLE_PATH/" || true

          # Verify core Decade + NST files inside bundle
          test -f "$BUNDLE_PATH/jarNO1"
          test -f "$BUNDLE_PATH/j2me_api.jar"
          test -f "$BUNDLE_PATH/minijvm_rt.jar"
          test -f "$BUNDLE_PATH/silent.wav"
          test -f "$BUNDLE_PATH/background-loop.wav"

          # Clean unsigned IPA (no _CodeSignature, no LC_CODE_SIGNATURE — 100% matching installable J2ME-Decade.ipa)
          rm -rf "$BUNDLE_PATH/_CodeSignature" "$BUNDLE_PATH/embedded.mobileprovision"
          chmod 755 "$BUNDLE_PATH/jarNO1"
          codesign --remove-signature "$BUNDLE_PATH/jarNO1" || true
          echo "=== Content of jarNO1.app ==="
          ls -la "$BUNDLE_PATH/"
          zip -r jarNO1.ipa Payload/
          ls -lh jarNO1.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarNO1-IPA
          path: jarNO1.ipa
          retention-days: 14

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.15-jarNO1
          name: "jarNO1 iOS v1.0.15 (Gộp Setup Bàn Phím Tất-Cả-Trong-1 + Động cơ x24 512MB)"
          body: |
            ## jarNO1 iOS v1.0.15 — Gộp Toàn Bộ Setup Bàn Phím Thành 1 & Nền Tảng x24 512MB
            - **Gộp toàn bộ chức năng Setup Bàn Phím về 1 nơi duy nhất (`DecadeKeyboardSetupViewController`, `TuoiThoPopupMenuView`, `GameViewController`, `DecadeConfigViewController`)**:
              - Rút gọn menu `[⋮]` từ 4 dòng bàn phím rời rạc xuống còn **1 mục duy nhất: `Setup Bàn Phím`**.
              - Xóa bỏ 6 hộp thoại/menu chồng chéo cũ; mở **1 bảng Setup Bàn Phím tổng hợp** (từ `[⋮] -> Setup Bàn Phím`, nhấn giữ `[🎮]`, hoặc từ `Cài Đặt Game -> Cài Đặt Bàn Phím`) gồm đầy đủ ngay trên 1 màn hình:
                1. Bật / Tắt bàn phím ảo
                2. Chọn kiểu bố cục (`Tuổi Thơ`, `Mũi Tên`, `Số`, `Kết Hợp`)
                3. Chọn chiều cao (`Nhỏ / Vừa / Chuẩn / Lớn`) & độ mờ (`40% / 70% / 100%`)
                4. Kéo thả di chuyển phím · Thu phóng 2 ngón · Khôi phục mặc định · Mở bàn phím gõ chữ QWERTY / IME
                5. Tích chọn Ẩn / Hiện từng phím cụ thể (`1–9`, `*`, `#`, `Del`, `L`, `R`, `OK`, `↑ ↓ ← →`...)
            - Giữ trọn toàn bộ tối ưu x24 & 512 MB từ `v1.0.14` (fix `g_native_extra_heap`, share sprite SHA-256, `mmap` JAR cache, xả `RenderContext` tab ẩn, Soft-GC & `-O3`).
          files: |
            jarNO1.ipa

name: Build J2ME Decade iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-26-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Compile and Package j2me_api.jar
        run: |
          echo "=== Compiling j2me_api.jar ==="
          cd j2me_api
          rm -rf classes sources.txt
          mkdir -p classes
          find src -name "*.java" > sources.txt
          javac --release 8 -cp "../J2MEEmulator/Resources/jars/minijvm_rt.jar" -d classes @sources.txt
          jar cf "../J2MEEmulator/Resources/jars/j2me_api.jar" -C classes .
          rm -rf classes sources.txt
          cd ..
          ls -lh J2MEEmulator/Resources/jars/j2me_api.jar

      - name: Build Application with Xcode
        run: |
          set -o pipefail
          xcodebuild -project J2MEEmulator.xcodeproj \
            -target J2MEEmulator \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$PWD/build_out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            clean build 2>&1 | tee build_raw.log || {
              echo "=== BUILD FAILED - RECENT LOGS ==="
              tail -n 120 build_raw.log
              exit 1
            }

      - name: Package App into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find "$PWD/build_out" -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          fi
          echo "Found App at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          cp -v J2MEEmulator/Resources/silent.wav Payload/*.app/ || true
          cp -v J2MEEmulator/SupportingFiles/J2MEEmulator.entitlements Payload/*.app/ || true
          codesign --force --deep --sign - --entitlements J2MEEmulator/SupportingFiles/J2MEEmulator.entitlements Payload/*.app || true
          echo "=== Content of App Bundle ==="
          ls -la Payload/*.app/
          zip -r J2ME-Decade.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-Decade-IPA
          path: J2ME-Decade.ipa
          retention-days: 14

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v2.22-native
          name: "Vạn Trần J2ME Native iOS v2.22"
          body: |
            ## Vạn Trần J2ME iOS v2.22 — Tối Ưu Tàn Sát Quái Chuẩn zNinjaPro & Dọn Sạch Dynamic Island Khi Thoát Game
            - **Tác giả**: **Vạn Trần idol J2me NSV IOS**
            - ⚔️ **Tối Ưu Tàn Sát Quái Toàn Bản Đồ Chuẩn zNinjaPro**:
              - **Triệt tiêu hoàn toàn lỗi đứng chờ quái**: Thuật toán tìm quái được tích hợp Fallback zNinjaPro thông minh. Khi các quái trong phạm vi gần hoặc quái theo bộ lọc cũ đã bị tiêu diệt hết, nhân vật sẽ lập tức quét toàn bộ bản đồ (`bt.J`), nhắm mục tiêu quái còn sống gần nhất để di chuyển/teleport tới và dọn sạch map liên tục, không bao giờ đứng yên chờ hồi sinh khi map vẫn còn quái.
              - **Hỗ trợ quái bay & quái địa hình đặc thù (Chim sắt, Dơi, Quái trên nóc/vách núi)**: Cơ chế giữ mục tiêu `aS` liên tục, không bị reset mục tiêu về `null` khi quái đang bay lơ lửng, giúp xuất chiêu đánh trúng quái bay mượt mà như zNinjaPro.
            - 🏝️ **Khắc Phục Triệt Để Hiện Tượng Dynamic Island / Now Playing Vẫn Hiện Khi Thoát Game**:
              - **Đóng sạch Dynamic Island & Now Playing**: Cập nhật hàm `stopKeepalive()` gọi `playbackState = .stopped` và giải phóng `AVAudioSession.sharedInstance().setActive(false, options: [.notifyOthersOnDeactivation])` ngay lập tức khi người chơi thoát game.
              - **Bắt đúng sự kiện thoát game từ Menu ("Thoát") trong game**: Khi người chơi bấm "Thoát" trong menu MIDlet của game, emulator nhận diện chính xác đây là thoát chủ động, ngay lập tức đóng màn hình, tắt chạy nền, dừng Dynamic Island và cập nhật danh sách game về trạng thái ngừng chạy tức thì.
            - ⚡️ **Bảo toàn đầy đủ bộ tính năng chạy nền vô hạn v2.21**:
              - Entitlements chạy nền vô hạn (`com.apple.multitasking.unlimited`, `BKSProcessAssertion` cờ `0xF`).
              - Pacing nhịp game 28 FPS khi tắt màn hình, CPU < 1%, không bao giờ bị iOS RunningBoard kill app.
              - Giữ mạng 24/24 chống ngủ Wi-Fi & rớt cổng 4G/5G.
            - **Cài đặt**: Tải file `J2ME-Decade.ipa` bên dưới rồi cài qua TrollStore, Sideloadly hoặc 3uTools.
          files: J2ME-Decade.ipa


name: Build jarNO1 iOS IPA (Decade + NST Cool Core)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-26-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Compile and Package j2me_api.jar
        run: |
          echo "=== Compiling j2me_api.jar ==="
          cd j2me_api
          rm -rf classes sources.txt
          mkdir -p classes
          find src -name "*.java" > sources.txt
          javac --release 8 -cp "../J2MEEmulator/Resources/jars/minijvm_rt.jar" -d classes @sources.txt
          jar cf "../J2MEEmulator/Resources/jars/j2me_api.jar" -C classes .
          rm -rf classes sources.txt
          cd ..
          ls -lh J2MEEmulator/Resources/jars/j2me_api.jar

      - name: Build Application with Xcode
        run: |
          set -o pipefail
          xcodebuild -project J2MEEmulator.xcodeproj \
            -target J2MEEmulator \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$PWD/build_out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            clean build 2>&1 | tee build_raw.log || {
              echo "=== BUILD FAILED - RECENT LOGS ==="
              tail -n 120 build_raw.log
              exit 1
            }

      - name: Package Clean Unsigned jarNO1.ipa
        run: |
          rm -rf Payload jarNO1.ipa
          mkdir -p Payload
          APP_PATH=$(find "$PWD/build_out" -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Built .app bundle not found!"
            exit 1
          fi
          echo "Found App at: $APP_PATH"
          cp -R "$APP_PATH" Payload/

          BUNDLE_PATH=$(find Payload -maxdepth 1 -name "*.app" -type d | head -n 1)
          cp -v J2MEEmulator/Resources/silent.wav "$BUNDLE_PATH/" || true
          cp -v J2MEEmulator/Resources/background-loop.wav "$BUNDLE_PATH/" || true

          # Verify core Decade + NST files inside bundle
          test -f "$BUNDLE_PATH/jarNO1"
          test -f "$BUNDLE_PATH/j2me_api.jar"
          test -f "$BUNDLE_PATH/minijvm_rt.jar"
          test -f "$BUNDLE_PATH/silent.wav"
          test -f "$BUNDLE_PATH/background-loop.wav"

          # Clean unsigned IPA (no _CodeSignature, no LC_CODE_SIGNATURE — 100% matching installable J2ME-Decade.ipa)
          rm -rf "$BUNDLE_PATH/_CodeSignature" "$BUNDLE_PATH/embedded.mobileprovision"
          chmod 755 "$BUNDLE_PATH/jarNO1"
          codesign --remove-signature "$BUNDLE_PATH/jarNO1" || true
          echo "=== Content of jarNO1.app ==="
          ls -la "$BUNDLE_PATH/"
          zip -r jarNO1.ipa Payload/
          ls -lh jarNO1.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarNO1-IPA
          path: jarNO1.ipa
          retention-days: 14

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.7-jarNO1
          name: "jarNO1 iOS v1.0.7 (Nâng cấp Dual-Layer Audio AURemoteIO + chống bấm nhầm tắt + báo cáo chạy nền thực tế)"
          body: |
            ## jarNO1 iOS v1.0.7 — Sửa Triệt Để Lỗi Off Game Khi Ẩn Đa Nhiệm & Tắt Khóa Màn Hình
            - **Nâng cấp lõi giữ nền Dual-Layer Audio chống đóng băng trên iOS 18/26**:
              - **Sửa lỗi `silent.wav * volume 0.01 = 0.45 LSB` (`-97 dBFS`, bị tròn về 0)** ở bản v1.0.6 khiến `mediaserverd` coi là im lặng và đóng băng tiến trình sau 5 giây.
              - **Lớp 1 (Mới — `AVAudioEngine` + `AVAudioSourceNode` `AURemoteIO`)**: chạy trực tiếp luồng phần cứng CoreAudio phát sóng siêu trầm 16 Hz ở mức `-50.5 dBFS` (`outputVolume = 1.0`) — hoàn toàn im lặng tuyệt đối với tai người và loa iPhone nhưng giữ kết nối phần cứng `mediaserverd` hoạt động liên tục 24/24 không ngắt quãng.
              - **Lớp 2 (Dự phòng chuẩn NST — `AVAudioPlayer`)**: chạy song song vòng lặp `silent.wav` (16 Hz `-57 dBFS`) ở mức `volume = 1.0`, dùng đúng lệnh 2 tham số `setCategory:withOptions:error:` + `setActive:error:` khớp 1:1 với J2ME NST, tự phục hồi khi đổi route / khóa màn / cấu hình âm thanh thay đổi (`AVAudioEngineConfigurationChange`).
              - **Thêm tùy chọn 1 chạm `Khóa Cứng Audio Độc Quyền`** trong tab `Treo 24/7` & `Cài Đặt Game` (mặc định là `Mix app khác` chuẩn NST để xem TikTok/YouTube song song; bật lên nếu muốn mức ưu tiên cao nhất khi treo khóa màn qua đêm).
            - **Chống bấm nhầm tắt + Tự reset bật mặc định khi cài đè v1.0.7**:
              - Nút trong menu `⋮` giờ hiển thị rõ ràng **`Treo 24/24: ĐANG BẬT ✓`** (xanh lá) / **`Treo 24/24: ĐANG TẮT`** (đỏ) để không bao giờ bị bấm nhầm tắt như trước; tự nâng cấp key lưu mới (`jarno1_treo_247_v7_off`) để bản v1.0.7 luôn mặc định **BẬT 24/24** ngay khi cài đặt.
              - Gỡ bỏ công tắc ảo `Treo Định Vị BTS (0% Pin)` cũ không còn tác dụng trong `Cài Đặt Game`.
            - **Đo kiểm chứng chạy nền thực tế ngay trên máy**:
              - Mỗi lần mở khóa màn hình / quay lại app sau khi ẩn từ 8 giây trở lên, app sẽ tự hiện 1 dòng xác nhận thời gian CPU thực tế đã chạy ngầm (ví dụ: `✓ Chạy nền xuyên suốt 60/60s (Engine+Player OK)`) và lưu chi tiết trong tab `Treo 24/7`.
            - **Sửa thêm 2 lỗi lõi native miniJVM**:
              - Bảo toàn mã timeout `-2` trong `SocketNative.readByte` (`jni_io.c`) tránh biến timeout thành lỗi đóng kết nối.
              - Sửa mốc thời gian tuyệt đối `TIME_UTC` cho `mtx_timedlock` trong `jthread_lock` (`jvm_util.c`) giảm spin CPU khi tranh chấp khóa.
            - Giữ nguyên **không có chế độ Bong Bóng**, chỉ giữ **Cửa Sổ Nhỏ PiP kéo to nhỏ tự do** khi bật chủ động, đóng gói **unsigned sạch 100%** (`jarNO1.ipa`).
          files: |
            jarNO1.ipa

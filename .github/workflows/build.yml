name: Build J2ME Decade iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-26-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build j2me_rust_engine for iOS
        run: |
          echo "=== Building j2me_rust_engine for iOS aarch64 ==="
          cargo build --manifest-path j2me_rust_engine/Cargo.toml --target aarch64-apple-ios --release
          ls -lh j2me_rust_engine/target/aarch64-apple-ios/release/libj2me_rust_engine.a

      - name: Compile and Package j2me_api.jar
        run: |
          echo "=== Compiling j2me_api.jar ==="
          cd j2me_api
          rm -rf classes sources.txt
          mkdir -p classes
          find src -name "*.java" > sources.txt
          javac --release 8 -cp "../J2MEEmulator/Resources/jars/minijvm_rt.jar" -d classes @sources.txt
          jar cf "../J2MEEmulator/Resources/jars/j2me_api.jar" -C classes .
          rm -rf classes sources.txt
          cd ..
          ls -lh J2MEEmulator/Resources/jars/j2me_api.jar

      - name: Build Application with Xcode
        run: |
          set -o pipefail
          xcodebuild -project J2MEEmulator.xcodeproj \
            -target J2MEEmulator \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$PWD/build_out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            clean build 2>&1 | tee build_raw.log || {
              echo "=== BUILD FAILED - RECENT LOGS ==="
              tail -n 120 build_raw.log
              exit 1
            }

      - name: Package App into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find "$PWD/build_out" -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          fi
          echo "Found App at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          cp -v J2MEEmulator/Resources/silent.wav Payload/*.app/ || true
          cp -v j2me_rust_engine/include/j2me_engine.h Payload/*.app/ || true

          # 1. Package Standard J2ME-Decade.ipa (Clean ad-hoc signature, compatible with Sideloadly, AltStore, ESign, Scarlet, 3uTools & TrollStore)
          rm -rf Payload/*.app/_CodeSignature
          codesign --force --deep --sign - Payload/*.app || true
          echo "=== Content of Standard App Bundle ==="
          ls -la Payload/*.app/
          zip -r J2ME-Decade.ipa Payload/

          # 2. Package TrollStore-specific J2ME-Decade-TrollStore.ipa (with private kernel & runningboard entitlements)
          rm -rf Payload/*.app/_CodeSignature
          cp -v J2MEEmulator/SupportingFiles/TrollStore.entitlements Payload/*.app/ || true
          codesign --force --deep --sign - --entitlements J2MEEmulator/SupportingFiles/TrollStore.entitlements Payload/*.app || true
          zip -r J2ME-Decade-TrollStore.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-Decade-IPA
          path: |
            J2ME-Decade.ipa
            J2ME-Decade-TrollStore.ipa
          retention-days: 14

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v2.25-fix-install
          name: "Vạn Trần J2ME Native iOS v2.25 (Fix Lỗi Cài Đặt Sideloadly / Scarlet / ESign & TrollStore)"
          body: |
            ## Vạn Trần J2ME iOS v2.25 — Bản Vá Fix Lỗi Không Thể Cài Đặt IPA
            - **Tác giả**: **Vạn Trần idol J2me NSV IOS**
            - 🛠️ **Khắc Phục Triệt Để Lỗi Không Thể Cài Đặt (Error 0xe8008016 / Invalid Entitlements)**:
              - Tách thành 2 bản IPA chuyên biệt:
                1. 🟢 `J2ME-Decade.ipa` (**Bản Chuẩn Sạch**): Tương thích 100% với mọi công cụ cài đặt (**Sideloadly, AltStore, SideStore, ESign, Scarlet, GBox, 3uTools** và cả TrollStore). Loại bỏ hoàn toàn các quyền private gây lỗi chứng chỉ khi cài qua Apple ID cá nhân.
                2. 🔵 `J2ME-Decade-TrollStore.ipa` (**Bản TrollStore chuyên dụng**): Tích hợp sẵn quyền tối cao `com.apple.private.runningboard.assertions` và `com.apple.private.kernel.override-cpumon` dành riêng cho máy có TrollStore hoặc Jailbreak.
            - ⚡ **Toàn Bộ Tính Năng Bản v2.24**:
              - Ngủ đông đồ hoạ 450ms (~2 FPS) khi tắt màn hình, CPU < 0.5%, treo 24/24 siêu mát máy chuẩn "Chơi Game Tuổi Thơ".
              - Socket native Apple Kernel `SO_TC_VO` (Voice/Interactive Priority) + Keepalive 10s giữ kết nối mạng 4G/Wi-Fi liên tục.
              - Auto tàn sát toàn map zNinjaPro.
              - Đầy đủ mã nguồn Rust Engine (`j2me_rust_engine`) và Flutter App (`j2me_flutter_app`) trong repo.
          files: |
            J2ME-Decade.ipa
            J2ME-Decade-TrollStore.ipa
            j2me_rust_engine/target/aarch64-apple-ios/release/libj2me_rust_engine.a

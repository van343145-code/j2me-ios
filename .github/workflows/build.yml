name: Build jarNO1 iOS IPA (Decade + NST Cool Core)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-26-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Compile and Package j2me_api.jar
        run: |
          echo "=== Compiling j2me_api.jar ==="
          cd j2me_api
          rm -rf classes sources.txt
          mkdir -p classes
          find src -name "*.java" > sources.txt
          javac --release 8 -cp "../J2MEEmulator/Resources/jars/minijvm_rt.jar" -d classes @sources.txt
          jar cf "../J2MEEmulator/Resources/jars/j2me_api.jar" -C classes .
          rm -rf classes sources.txt
          cd ..
          ls -lh J2MEEmulator/Resources/jars/j2me_api.jar

      - name: Build Application with Xcode
        run: |
          set -o pipefail
          xcodebuild -project J2MEEmulator.xcodeproj \
            -target J2MEEmulator \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$PWD/build_out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            clean build 2>&1 | tee build_raw.log || {
              echo "=== BUILD FAILED - RECENT LOGS ==="
              tail -n 120 build_raw.log
              exit 1
            }

      - name: Package Clean Unsigned jarNO1.ipa
        run: |
          rm -rf Payload jarNO1.ipa
          mkdir -p Payload
          APP_PATH=$(find "$PWD/build_out" -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Built .app bundle not found!"
            exit 1
          fi
          echo "Found App at: $APP_PATH"
          cp -R "$APP_PATH" Payload/

          BUNDLE_PATH=$(find Payload -maxdepth 1 -name "*.app" -type d | head -n 1)
          cp -v J2MEEmulator/Resources/silent.wav "$BUNDLE_PATH/" || true
          cp -v J2MEEmulator/Resources/background-loop.wav "$BUNDLE_PATH/" || true

          # Verify core Decade + NST files inside bundle
          test -f "$BUNDLE_PATH/jarNO1"
          test -f "$BUNDLE_PATH/j2me_api.jar"
          test -f "$BUNDLE_PATH/minijvm_rt.jar"
          test -f "$BUNDLE_PATH/silent.wav"
          test -f "$BUNDLE_PATH/background-loop.wav"

          # Clean unsigned IPA (no _CodeSignature, no LC_CODE_SIGNATURE — 100% matching installable J2ME-Decade.ipa)
          rm -rf "$BUNDLE_PATH/_CodeSignature" "$BUNDLE_PATH/embedded.mobileprovision"
          chmod 755 "$BUNDLE_PATH/jarNO1"
          codesign --remove-signature "$BUNDLE_PATH/jarNO1" || true
          echo "=== Content of jarNO1.app ==="
          ls -la "$BUNDLE_PATH/"
          zip -r jarNO1.ipa Payload/
          ls -lh jarNO1.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarNO1-IPA
          path: jarNO1.ipa
          retention-days: 14

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.13-jarNO1
          name: "jarNO1 iOS v1.0.13 (Fix dứt điểm iOS kill 45p: CPU 50%, RAM 221MB & jthread_lock spin)"
          body: |
            ## jarNO1 iOS v1.0.13 — Fix Dứt Điểm iOS Dừng Nền (CPU 50% / RAM 221MB / `jthread_lock` spin)
            - **Fix `Canvas.repaint()` không giảm nhịp FPS nền (`Canvas.java`)**:
              - Trước đây ngưỡng anti-spin nền chỉ chặn khi `> 60 FPS`, nên game 30–40 FPS (như `NSOVTIDOL`) vẫn chạy full 40 tick/giây khi tắt màn -> ăn liên tục **50% CPU** và bị iOS bắn `CPU_FATAL` sau ~45 phút.
              - Nay ép nhịp nền mượt **`10 FPS` (`100 ms/tick`)** qua `limitBgFps()` -> hạ CPU nền từ **50% xuống ~12%** trong khi auto đánh/nhặt/buff vẫn mượt 100%.
            - **Fix `jthread_lock()` quay vòng 100% CPU (`jvm_util.c`)**:
              - Thay `mtx_timedlock` với `t.tv_sec = 0` (epoch 1970 đã hết hạn, khiến Darwin fail tức thì và quay `sched_yield` 100% CPU) bằng `mtx_trylock` + `jthread_block_enter/exit` + ngủ lũy tiến (`5ms` nền / `1ms` tiền cảnh).
              - Mở rộng giới hạn ngủ fallback `r1` (`jthread_waitTime`) lên `1000ms` khi chạy nền.
            - **Fix RAM phình lên 221MB khi treo lâu (`garbage.c`)**:
              - Gọi `malloc_zone_pressure_relief(NULL, 0)` ngay sau mỗi chu kỳ GC chạy nền để trả bộ nhớ đã giải phóng về lại nhân iOS, chặn Jetsam kill app.
          files: |
            jarNO1.ipa

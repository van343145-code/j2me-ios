name: Build jarNO1 iOS IPA (Decade + NST Cool Core)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-26-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Compile and Package j2me_api.jar
        run: |
          echo "=== Compiling j2me_api.jar ==="
          cd j2me_api
          rm -rf classes sources.txt
          mkdir -p classes
          find src -name "*.java" > sources.txt
          javac --release 8 -cp "../J2MEEmulator/Resources/jars/minijvm_rt.jar" -d classes @sources.txt
          jar cf "../J2MEEmulator/Resources/jars/j2me_api.jar" -C classes .
          rm -rf classes sources.txt
          cd ..
          ls -lh J2MEEmulator/Resources/jars/j2me_api.jar

      - name: Build Application with Xcode
        run: |
          set -o pipefail
          xcodebuild -project J2MEEmulator.xcodeproj \
            -target J2MEEmulator \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$PWD/build_out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            clean build 2>&1 | tee build_raw.log || {
              echo "=== BUILD FAILED - RECENT LOGS ==="
              tail -n 120 build_raw.log
              exit 1
            }

      - name: Package Clean Unsigned jarNO1.ipa
        run: |
          rm -rf Payload jarNO1.ipa
          mkdir -p Payload
          APP_PATH=$(find "$PWD/build_out" -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Built .app bundle not found!"
            exit 1
          fi
          echo "Found App at: $APP_PATH"
          cp -R "$APP_PATH" Payload/

          BUNDLE_PATH=$(find Payload -maxdepth 1 -name "*.app" -type d | head -n 1)
          cp -v J2MEEmulator/Resources/silent.wav "$BUNDLE_PATH/" || true
          cp -v J2MEEmulator/Resources/background-loop.wav "$BUNDLE_PATH/" || true

          # Verify core Decade + NST files inside bundle
          test -f "$BUNDLE_PATH/jarNO1"
          test -f "$BUNDLE_PATH/j2me_api.jar"
          test -f "$BUNDLE_PATH/minijvm_rt.jar"
          test -f "$BUNDLE_PATH/silent.wav"
          test -f "$BUNDLE_PATH/background-loop.wav"

          # Clean unsigned IPA (no _CodeSignature, no LC_CODE_SIGNATURE — 100% matching installable J2ME-Decade.ipa)
          rm -rf "$BUNDLE_PATH/_CodeSignature" "$BUNDLE_PATH/embedded.mobileprovision"
          chmod 755 "$BUNDLE_PATH/jarNO1"
          codesign --remove-signature "$BUNDLE_PATH/jarNO1" || true
          echo "=== Content of jarNO1.app ==="
          ls -la "$BUNDLE_PATH/"
          zip -r jarNO1.ipa Payload/
          ls -lh jarNO1.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarNO1-IPA
          path: jarNO1.ipa
          retention-days: 14

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.14-jarNO1
          name: "jarNO1 iOS v1.0.14 (512MB Heap, x24 Multi-Tab RAM & CPU Engine kiểu NST)"
          body: |
            ## jarNO1 iOS v1.0.14 — Nâng Cấp Động Cơ Đa Tab (x24) & Giới Hạn 512MB Kiểu J2ME NST
            - **Thứ 1 — Nâng trần heap lên 512 MB & Fix lỗi GC toàn cục (`jvm_bridge.c`, `garbage.c`, `jvm.h`)**:
              - Nâng `max_heap_size` lên **`512 MB` (`536870912` bytes)** giống `LangNatives.MaxMemory` của J2ME NST.
              - Sửa lỗi nghiêm trọng `g_native_extra_heap` toàn cục làm cả 24 tab bị kích hoạt Stop-The-World GC liên tục cùng lúc -> chuyển sang đếm `native_heap_size` độc lập theo từng `MiniJVM`.
              - Thêm **Soft-GC thông minh cho tab ẩn** (giữ live heap mỗi tab ẩn nhỏ + bỏ qua chu kỳ GC khi rác mới < 2MB + gọi `malloc_zone_pressure_relief` trả page về nhân iOS ngay).
            - **Thứ 2 — Giảm mạnh RAM mỗi tab (`j2me_render.m`, `Canvas.java`, `GameViewController.swift`, `miniz_wrapper.c`)**:
              - **Share ảnh sprite PNG bất biến qua SHA-256 giữa tất cả các tab** + bỏ giữ bản sao `img->ctx` thứ 2 -> cắt mạnh RAM ảnh khi treo x24 và bỏ giới hạn mảng cứng `TRACK_MAX = 8192`.
              - Tự động xả `Canvas` offscreen `RenderContext` của tab đang ẩn (tạo lại tức thì khi chạm tab) và xả `slotFrames` thừa ngoài split-view.
              - Dùng chung `mmap` read-only cache cho `.jar` trong `miniz_wrapper.c` thay vì mở/parse zip lại từ đầu ở mỗi tab.
            - **Thứ 3 — Tiết kiệm CPU cho treo x24 (`Canvas.java`, `Display.java`, `interpreter.c`, `j2me_input.c`, `project.pbxproj`)**:
              - Bỏ check `jdwp_client_count` trên từng lệnh bytecode khi không debug + bật `GCC_OPTIMIZATION_LEVEL = 3` cho bản `Release`.
              - Điều phối wake per-slot trong `j2me_input.c`, tăng ngủ nhàn rỗi `Display.runEventLoop` ở tab ẩn lên `1000ms`, và tự động hạ nhịp vẽ nền theo số tab (`10 FPS` -> `5 FPS` -> `3-4 FPS` ở x12-x24).
          files: |
            jarNO1.ipa

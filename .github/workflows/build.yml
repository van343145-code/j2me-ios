name: Build J2ME Decade iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-26-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Compile and Package j2me_api.jar
        run: |
          echo "=== Compiling j2me_api.jar ==="
          cd j2me_api
          rm -rf classes sources.txt
          mkdir -p classes
          find src -name "*.java" > sources.txt
          javac --release 8 -cp "../J2MEEmulator/Resources/jars/minijvm_rt.jar" -d classes @sources.txt
          jar cf "../J2MEEmulator/Resources/jars/j2me_api.jar" -C classes .
          rm -rf classes sources.txt
          cd ..
          ls -lh J2MEEmulator/Resources/jars/j2me_api.jar

      - name: Build Application with Xcode
        run: |
          set -o pipefail
          xcodebuild -project J2MEEmulator.xcodeproj \
            -target J2MEEmulator \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$PWD/build_out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            clean build 2>&1 | tee build_raw.log || {
              echo "=== BUILD FAILED - RECENT LOGS ==="
              tail -n 120 build_raw.log
              exit 1
            }

      - name: Package App into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find "$PWD/build_out" -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          fi
          echo "Found App at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          cp -v J2MEEmulator/Resources/silent.wav Payload/*.app/ || true
          cp -v J2MEEmulator/SupportingFiles/J2MEEmulator.entitlements Payload/*.app/ || true
          codesign --force --deep --sign - --entitlements J2MEEmulator/SupportingFiles/J2MEEmulator.entitlements Payload/*.app || true
          echo "=== Content of App Bundle ==="
          ls -la Payload/*.app/
          zip -r J2ME-Decade.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-Decade-IPA
          path: J2ME-Decade.ipa
          retention-days: 14

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v2.23-native
          name: "Vạn Trần J2ME Native iOS v2.23"
          body: |
            ## Vạn Trần J2ME iOS v2.23 — Đột Phá Treo Nền 24/24 Siêu Mát Máy Chuẩn "Chơi Game Tuổi Thơ" & Socket Native SO_TC_VO
            - **Tác giả**: **Vạn Trần idol J2me NSV IOS**
            - ⚡ **Bí thuật Ngủ Đông Đồ Hoạ Chuẩn "Chơi Game Tuổi Thơ" (Display.class 450L)**:
              - **Triệt tiêu hoàn toàn `serviceRepaints()` khi tắt màn hình**: Trong J2ME, luồng game liên tục gọi vẽ hình ảnh 60 lần/giây. Khi tắt màn hình hoặc ẩn app, `serviceRepaints()` lập tức trả về ngay (`return`). Luồng tính toán tự đánh, di chuyển, nhặt yên và nhận gói mạng vẫn chạy 100% bình thường nhưng **0% CPU bị lãng phí cho việc vẽ hình ảnh**.
              - **Pacing chu kỳ vẽ 450ms (~2 FPS)**: Chu kỳ vẽ `doPaint()` và `repaint()` khi ở nền được ép về 450 mili-giây, bỏ qua toàn bộ việc gọi CoreGraphics và render GPU (`flushToScreen`).
              - **Mức tiêu thụ CPU nền giảm xuống < 0.5%**: Khắc phục triệt để hiện tượng treo đến phút 57 bị đơ/văng do iOS RunningBoard CPU Watchdog. Máy mát rượi, pin không tụt, treo xuyên ngày đêm không bao giờ sập!
            - 🌐 **Nâng Cấp Tầng Mạng Socket Native Apple Kernel (SO_TRAFFIC_CLASS)**:
              - **Gán cờ `SO_TC_VO` (Voice/Interactive Priority)**: Báo trực tiếp cho chip Wi-Fi và modem băng tần 4G/5G của iPhone rằng đây là luồng socket tương tác nền ưu tiên cao nhất, tuyệt đối không bị iOS hạ xung nhịp radio hoặc ngắt mạng khi máy vào Deep Sleep.
              - **Keepalive probes 10s / 5s**: Giữ thông cổng NAT với server game liên tục, chống đứt kết nối của các nhà mạng Viettel, Vinaphone, Mobifone.
            - ⚔️ **Tích hợp đầy đủ Auto Tàn Sát Toàn Map zNinjaPro & Dọn Sạch Dynamic Island khi thoát game của v2.22**.
            - **Cài đặt**: Tải file `J2ME-Decade.ipa` bên dưới rồi cài qua TrollStore, Sideloadly hoặc 3uTools.
          files: J2ME-Decade.ipa


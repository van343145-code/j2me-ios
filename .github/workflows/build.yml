name: Build J2ME NSV iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-26-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Verify Runtime Assets
        run: |
          test -f Runtime/j2mejs/index.html
          test -f Runtime/j2mejs/java/classes.jar
          test -f Runtime/j2mejs/certs/_main.ks
          test -f Runtime/j2mejs/js/nsv-runtime.js
          test -f Runtime/j2mejs/js/nsv-network.js
          test -f Licenses/Runtime-Attribution.txt

      - name: Build Application with Xcode
        run: |
          set -o pipefail
          xcodebuild -project J2MEEmulator.xcodeproj \
            -target J2MEEmulator \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$PWD/build_out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            clean build 2>&1 | tee build_raw.log || {
              echo "=== BUILD FAILED - RECENT LOGS ==="
              tail -n 120 build_raw.log
              exit 1
            }

      - name: Package App into IPA
        run: |
          rm -rf Payload J2ME-NSV.ipa
          mkdir -p Payload
          APP_PATH=$(find "$PWD/build_out" -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Built .app bundle not found!"
            exit 1
          fi
          echo "Found App at: $APP_PATH"
          cp -R "$APP_PATH" Payload/

          BUNDLE_PATH=$(find Payload -maxdepth 1 -name "*.app" -type d | head -n 1)
          echo "Verifying embedded Runtime inside: $BUNDLE_PATH"
          test -f "$BUNDLE_PATH/Runtime/j2mejs/index.html"
          test -f "$BUNDLE_PATH/Runtime/j2mejs/java/classes.jar"
          test -f "$BUNDLE_PATH/Runtime/j2mejs/certs/_main.ks"

          rm -rf "$BUNDLE_PATH/_CodeSignature"
          codesign --force --deep --sign - "$BUNDLE_PATH" || true
          echo "=== Content of App Bundle ==="
          ls -la "$BUNDLE_PATH/"
          zip -r J2ME-NSV.ipa Payload/
          ls -lh J2ME-NSV.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-NSV-IPA
          path: J2ME-NSV.ipa
          retention-days: 14

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0-nsv-port
          name: "J2ME NSV iOS v0.1.0 (Port 1:1 SwiftUI + WebKit j2mejs)"
          body: |
            ## J2ME NSV iOS — Bản Port 1:1 Chuẩn Nguyên Bản
            - **Lõi giả lập**: SwiftUI + `WKWebView` + `j2mejs` + `LoopbackServer` (`NWListener` 127.0.0.1) + `GameNetworkBridge` (`URLSession` + `NWConnection` TCP).
            - **Mát máy & nhẹ pin**: Loại bỏ hoàn toàn miniJVM/C/ObjC/Rust spin-loop, GPS background và watchdog 5 giây.
            - **Không còn lỗi tự mở hành trang**: Khởi chạy sạch từ màn hình thư viện, không gửi tọa độ `(0,0)` giả.
            - **Treo game bong bóng + nền**: Hỗ trợ nút `Bong bóng` thu nhỏ nổi kéo thả tự do, âm thanh nền `.playback` và `UIBackgroundTask` (`J2ME-NSV-AFK`).
            - **Cài đặt sạch 100%**: Không chứa private entitlements — tương thích Sideloadly, AltStore, SideStore, ESign, Scarlet, 3uTools và TrollStore.
          files: |
            J2ME-NSV.ipa

name: Build jarNO1 iOS IPA (Decade + NST Cool Core)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-26-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Compile and Package j2me_api.jar
        run: |
          echo "=== Compiling j2me_api.jar ==="
          cd j2me_api
          rm -rf classes sources.txt
          mkdir -p classes
          find src -name "*.java" > sources.txt
          javac --release 8 -cp "../J2MEEmulator/Resources/jars/minijvm_rt.jar" -d classes @sources.txt
          jar cf "../J2MEEmulator/Resources/jars/j2me_api.jar" -C classes .
          rm -rf classes sources.txt
          cd ..
          ls -lh J2MEEmulator/Resources/jars/j2me_api.jar

      - name: Build Application with Xcode
        run: |
          set -o pipefail
          xcodebuild -project J2MEEmulator.xcodeproj \
            -target J2MEEmulator \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$PWD/build_out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            clean build 2>&1 | tee build_raw.log || {
              echo "=== BUILD FAILED - RECENT LOGS ==="
              tail -n 120 build_raw.log
              exit 1
            }

      - name: Package Clean Unsigned jarNO1.ipa
        run: |
          rm -rf Payload jarNO1.ipa
          mkdir -p Payload
          APP_PATH=$(find "$PWD/build_out" -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Built .app bundle not found!"
            exit 1
          fi
          echo "Found App at: $APP_PATH"
          cp -R "$APP_PATH" Payload/

          BUNDLE_PATH=$(find Payload -maxdepth 1 -name "*.app" -type d | head -n 1)
          cp -v J2MEEmulator/Resources/silent.wav "$BUNDLE_PATH/" || true
          cp -v J2MEEmulator/Resources/background-loop.wav "$BUNDLE_PATH/" || true

          # Verify core Decade + NST files inside bundle
          test -f "$BUNDLE_PATH/jarNO1"
          test -f "$BUNDLE_PATH/j2me_api.jar"
          test -f "$BUNDLE_PATH/minijvm_rt.jar"
          test -f "$BUNDLE_PATH/silent.wav"
          test -f "$BUNDLE_PATH/background-loop.wav"

          # Clean unsigned IPA (no _CodeSignature, no LC_CODE_SIGNATURE — 100% matching installable J2ME-Decade.ipa)
          rm -rf "$BUNDLE_PATH/_CodeSignature" "$BUNDLE_PATH/embedded.mobileprovision"
          chmod 755 "$BUNDLE_PATH/jarNO1"
          codesign --remove-signature "$BUNDLE_PATH/jarNO1" || true
          echo "=== Content of jarNO1.app ==="
          ls -la "$BUNDLE_PATH/"
          zip -r jarNO1.ipa Payload/
          ls -lh jarNO1.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarNO1-IPA
          path: jarNO1.ipa
          retention-days: 14

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.9-jarNO1
          name: "jarNO1 iOS v1.0.9 (Fix CPU/GC Watchdog SIGKILL khi tắt màn hình + tối ưu chạy ngầm 24/24)"
          body: |
            ## jarNO1 iOS v1.0.9 — Sửa Lỗi iOS Tự Tắt App Khi Khóa Màn Hình / Treo Ngầm
            - **Xác định chính xác nguyên nhân từ ảnh chụp 15:29 → 15:32 ở v1.0.8**:
              - Khi khóa màn hình dù `Treo 24/24: ĐANG BẬT ✓`, toàn bộ tiến trình `jarNO1` bị iOS dừng ngầm (khởi động lại về màn hình chọn game `0 / 1 Game`) do **CPU & Wakeup Watchdog nền** (chứ không phải lỗi mất kết nối trong game):
              1. **Sửa lỗi chí mạng trong miniJVM GC (`garbage.c` + `jvm_bridge.c`)**:
                 - Trước đây khi heap Java + ảnh native RGBA (`VTninjaPro`) vượt `31.2 MB` (`48 MB × 65%`), vòng lặp `_gc_thread_run` bỏ qua nhánh `threadSleep` và **chạy `_garbage_collect()` liên tục 0ms nghỉ ở mức 100% CPU**, khiến iOS kích hoạt `CPU_FATAL` (`>80%` CPU nền) và tắt app ngay sau 1–3 phút khóa màn hình.
                 - Đã sửa **luôn ngủ sau mỗi chu kỳ GC** (`1000ms` nền trước / `3000ms` nền sau) và nâng trần heap `48 MB → 96 MB` (`75%`) để không bao giờ kẹt vòng lặp GC 100% CPU.
              2. **Ngừng `Canvas.paint(graphics)` hoàn toàn khi ẩn / khóa màn hình (`Canvas.java` + `j2me_render.m`)**:
                 - Khi `NativeBridge.isBackground()` bật (chưa bật PiP) hoặc ở tab ẩn, `Canvas` bỏ qua hoàn toàn bytecode `paint()` và `EventQueue` repaint (khi mở lại app hoặc mở PiP, `Display.runEventLoop()` tự vẽ lại toàn màn hình tức thì), cắt mạnh ~70% CPU & RAM nền trong khi logic auto đánh quái & socket mạng chạy mượt 100%.
              3. **Chặn bão đánh thức CPU nền (`jvm_util.c` + `jni_io.c`)**:
                 - Tự kẹp các vòng `Thread.sleep(1..24ms)` thành `25ms` (40 Hz mượt) **chỉ khi ở nền**, ngăn game auto-hit/vòng lặp tick overrun vượt ngưỡng `150 wakeups/giây` của iOS khi tắt màn hình.
              4. **Hộp đen ghi trạng thái nền (`DecadeBackgroundKeeper`)**:
                 - Lưu nhịp chạy nền 5 giây/lần vào bộ nhớ bền vững (`UserDefaults`) và tự dọn bộ nhớ khi vừa tắt màn hình, giữ nguyên **100% lõi `AVAudioPlayer` + `background-loop.wav` gốc của J2ME NST 1.0.0**, không có chế độ Bong Bóng, giữ PiP cửa sổ nhỏ kéo to nhỏ ngoài màn hình.
          files: |
            jarNO1.ipa

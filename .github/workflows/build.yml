name: Build jarNO1 iOS IPA (Decade + NST Cool Core)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-26-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Compile and Package j2me_api.jar
        run: |
          echo "=== Compiling j2me_api.jar ==="
          cd j2me_api
          rm -rf classes sources.txt
          mkdir -p classes
          find src -name "*.java" > sources.txt
          javac --release 8 -cp "../J2MEEmulator/Resources/jars/minijvm_rt.jar" -d classes @sources.txt
          jar cf "../J2MEEmulator/Resources/jars/j2me_api.jar" -C classes .
          rm -rf classes sources.txt
          cd ..
          ls -lh J2MEEmulator/Resources/jars/j2me_api.jar

      - name: Build Application with Xcode
        run: |
          set -o pipefail
          xcodebuild -project J2MEEmulator.xcodeproj \
            -target J2MEEmulator \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$PWD/build_out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            clean build 2>&1 | tee build_raw.log || {
              echo "=== BUILD FAILED - RECENT LOGS ==="
              tail -n 120 build_raw.log
              exit 1
            }

      - name: Package Clean Unsigned jarNO1.ipa
        run: |
          rm -rf Payload jarNO1.ipa
          mkdir -p Payload
          APP_PATH=$(find "$PWD/build_out" -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Built .app bundle not found!"
            exit 1
          fi
          echo "Found App at: $APP_PATH"
          cp -R "$APP_PATH" Payload/

          BUNDLE_PATH=$(find Payload -maxdepth 1 -name "*.app" -type d | head -n 1)
          cp -v J2MEEmulator/Resources/silent.wav "$BUNDLE_PATH/" || true
          cp -v J2MEEmulator/Resources/background-loop.wav "$BUNDLE_PATH/" || true

          # Verify core Decade + NST files inside bundle
          test -f "$BUNDLE_PATH/jarNO1"
          test -f "$BUNDLE_PATH/j2me_api.jar"
          test -f "$BUNDLE_PATH/minijvm_rt.jar"
          test -f "$BUNDLE_PATH/background-loop.wav"

          # Clean unsigned IPA (no _CodeSignature, no LC_CODE_SIGNATURE — 100% matching installable J2ME-Decade.ipa)
          rm -rf "$BUNDLE_PATH/_CodeSignature" "$BUNDLE_PATH/embedded.mobileprovision"
          chmod 755 "$BUNDLE_PATH/jarNO1"
          codesign --remove-signature "$BUNDLE_PATH/jarNO1" || true
          echo "=== Content of jarNO1.app ==="
          ls -la "$BUNDLE_PATH/"
          zip -r jarNO1.ipa Payload/
          ls -lh jarNO1.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarNO1-IPA
          path: jarNO1.ipa
          retention-days: 14

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.4-jarNO1
          name: "jarNO1 iOS v1.0.4 (Fix 1:1 Ẩn Ứng Dụng & Treo Chạy Nền chuẩn J2ME NST 1.0.0)"
          body: |
            ## jarNO1 iOS v1.0.4 — Fix 1:1 Ẩn Ứng Dụng & Treo Chạy Nền chuẩn J2ME NST 1.0.0.ipa
            - **Khắc phục triệt để lỗi ẩn app / thoát ra ngoài là mất kết nối game** (đối chiếu ARM64 trực tiếp với `J2ME_NST_1.0.0.ipa`):
              - Mặc định **BẬT Treo 24/24 (`isTreoActive = true` qua key đảo ngược `jarno1_sticky_off`, khớp 1:1 `App.Sticky` của `J2ME NST`)**: `AVAudioPlayer` (`background-loop.wav`, `.playback` + `.mixWithOthers`, `volume = 0.0`) được khởi chạy ngay khi vào game lúc app đang mở (foreground), đảm bảo iOS cấp quyền chạy nền trước khi bấm **Ẩn Ứng Dụng**, vuốt Home hay khóa màn hình.
              - Thêm guard chặn gọi lại `AVAudioSession.setCategory` / `setActive(true)` khi `audioPlayer.isPlaying == true` và bỏ đăng ký trùng lặp `didEnterBackgroundNotification` giữa `SceneDelegate` & `NotificationCenter` (nguyên nhân làm ngắt audio session đúng lúc chuyển nền ở bản v1.0.3).
              - Bổ sung timer bàn giao `beginBackgroundTask` 4.0 giây rồi `endBackgroundTask` sạch sẽ (khớp 1:1 `AppDelegate.DidEnterBackground` của `J2ME NST`).
              - Tắt `canStartPictureInPictureAutomaticallyFromInline` và bỏ cờ `.allowBluetooth` sai chuẩn trên category `.playback` trong `DecadePiPManager` để không xung đột audio khi ẩn app.
              - Sửa `forceExitGame()` chỉ dừng audio keepalive, không còn xóa mất thiết lập `Treo Khi Ra Ngoài` đã lưu.
            - Giữ nguyên toàn bộ cải tiến từ v1.0.3: lõi native `miniJVM` + UI `J2ME Decade`, fix tự mở Hành trang, lõi mát máy 30 FPS / event-driven `waitForInput`, đóng gói **unsigned sạch 100%** (`jarNO1.ipa`).
          files: |
            jarNO1.ipa

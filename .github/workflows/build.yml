name: Build jarNO1 iOS IPA (Decade + NST Cool Core)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-26-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Compile and Package j2me_api.jar
        run: |
          echo "=== Compiling j2me_api.jar ==="
          cd j2me_api
          rm -rf classes sources.txt
          mkdir -p classes
          find src -name "*.java" > sources.txt
          javac --release 8 -cp "../J2MEEmulator/Resources/jars/minijvm_rt.jar" -d classes @sources.txt
          jar cf "../J2MEEmulator/Resources/jars/j2me_api.jar" -C classes .
          rm -rf classes sources.txt
          cd ..
          ls -lh J2MEEmulator/Resources/jars/j2me_api.jar

      - name: Build Application with Xcode
        run: |
          set -o pipefail
          xcodebuild -project J2MEEmulator.xcodeproj \
            -target J2MEEmulator \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$PWD/build_out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            clean build 2>&1 | tee build_raw.log || {
              echo "=== BUILD FAILED - RECENT LOGS ==="
              tail -n 120 build_raw.log
              exit 1
            }

      - name: Package Clean Unsigned jarNO1.ipa
        run: |
          rm -rf Payload jarNO1.ipa
          mkdir -p Payload
          APP_PATH=$(find "$PWD/build_out" -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Built .app bundle not found!"
            exit 1
          fi
          echo "Found App at: $APP_PATH"
          cp -R "$APP_PATH" Payload/

          BUNDLE_PATH=$(find Payload -maxdepth 1 -name "*.app" -type d | head -n 1)
          cp -v J2MEEmulator/Resources/silent.wav "$BUNDLE_PATH/" || true
          cp -v J2MEEmulator/Resources/background-loop.wav "$BUNDLE_PATH/" || true

          # Verify core Decade + NST files inside bundle
          test -f "$BUNDLE_PATH/jarNO1"
          test -f "$BUNDLE_PATH/j2me_api.jar"
          test -f "$BUNDLE_PATH/minijvm_rt.jar"
          test -f "$BUNDLE_PATH/silent.wav"
          test -f "$BUNDLE_PATH/background-loop.wav"

          # Clean unsigned IPA (no _CodeSignature, no LC_CODE_SIGNATURE — 100% matching installable J2ME-Decade.ipa)
          rm -rf "$BUNDLE_PATH/_CodeSignature" "$BUNDLE_PATH/embedded.mobileprovision"
          chmod 755 "$BUNDLE_PATH/jarNO1"
          codesign --remove-signature "$BUNDLE_PATH/jarNO1" || true
          echo "=== Content of jarNO1.app ==="
          ls -la "$BUNDLE_PATH/"
          zip -r jarNO1.ipa Payload/
          ls -lh jarNO1.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarNO1-IPA
          path: jarNO1.ipa
          retention-days: 14

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.6-jarNO1
          name: "jarNO1 iOS v1.0.6 (Sửa triệt để treo tắt màn 24/24 & tự nhớ chạy ẩn đa nhiệm chuẩn NST)"
          body: |
            ## jarNO1 iOS v1.0.6 — Treo Tắt Màn & Chạy Ẩn Đa Nhiệm 24/24 Không Nghỉ (Chuẩn J2ME NST)
            - **Sửa triệt để lỗi khóa màn hình / ẩn đa nhiệm bị off game**:
              - **Tách hoàn toàn `AVPictureInPictureController` / `AVSampleBufferDisplayLayer` khỏi khởi động mặc định**: chỉ tạo khi bấm `Cửa Sổ Nhỏ Ngoài Màn Hình` và giải phóng sạch khi đóng, đảm bảo phiên giữ nền là **100% pure audio-only** chuẩn `J2ME NST` — không bị iOS ngắt phiên video khi khóa màn hình.
              - **Sửa lỗi `AVAudioPlayer.volume = 0.0` bị iOS 18/26 `mediaserverd` coi là tắt tiếng và đóng băng khi khóa màn**: phát `silent.wav` siêu trầm 16Hz (`-60 dBFS`, không nghe thấy ở mọi mức âm lượng) với `volume = 0.01` (tổng `-100 dBFS`, khác 0 cả PCM lẫn volume) + `.playback` / `.default` / `.mixWithOthers`.
              - **Tự hồi phục khi có ngắt âm thanh / đổi thiết bị / khóa màn lặp lại**: sửa lỗi khóa vĩnh viễn cờ `interrupted = true` khi iOS không gửi `.ended`, lắng nghe đầy đủ `SceneDelegate` + `UIApplication` + `protectedDataWillBecomeUnavailableNotification` (khóa màn hình), tự gia hạn cầu nối 5 giây và kiểm tra lại mỗi 3 giây.
              - **Tự nhớ chạy ẩn 24/24 y hệt J2ME NST**: bật `Ẩn Ứng Dụng (Chạy Ngầm)` 1 lần (hoặc giữ tích xanh `✓ Treo tắt màn 24/24` trong menu `⋮`) sẽ tự động lưu vĩnh viễn vào máy — mọi lần sau chỉ cần vuốt ẩn xuống đa nhiệm hay bấm nút nguồn tắt màn hình là game tự chạy nền liên tục 24/24 không nghỉ.
            - **Tối ưu ổn định kết nối mạng & CPU nền**:
              - Gỡ bỏ cờ `SO_TC_VO` dễ gây rớt NAT Wi-Fi/4G trên app non-VoIP, giữ `SO_KEEPALIVE` (20s/10s/12 lần) + `TCP_NODELAY` + chuyển `select()` sang `poll()` chống tràn `FD_SET` và xử lý an toàn `EAGAIN`/`EINTR`.
              - Sửa lỗi tràn `tv_nsec` trong `vm_share_timedwait` (miniJVM) và thêm bộ chặn spin CPU nền trên `Canvas.repaint()`, cộng thêm bảo vệ OpenGL ES M3G khi ở nền.
            - Giữ nguyên **không có chế độ Bong Bóng**, chỉ giữ **Cửa Sổ Nhỏ PiP kéo to nhỏ tự do** khi bật chủ động, đóng gói **unsigned sạch 100%** (`jarNO1.ipa`).
          files: |
            jarNO1.ipa
